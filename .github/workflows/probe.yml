name: tff-probe
# Manual diagnostic: auth + RSS + channel inventory + AI path reachability.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: enable BBR
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: probe
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TFS_BASE: ${{ github.workspace }}/state
        run: |
          python3 tfs_engine.py auth
          python3 tfs_engine.py channels
