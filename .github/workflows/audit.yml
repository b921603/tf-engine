name: tff-audit
# Monthly fidelity audit: LRC drift / visible timestamps / missing desc /
# missing cover fid / missing articles — across all TFS channels.
on:
  schedule:
    - cron: "3 5 2 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: restore rotate cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: tff-state-au-${{ github.run_id }}
          restore-keys: tff-state-
      - name: audit
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TFS_BASE: ${{ github.workspace }}/state
        run: python3 tfs_engine.py audit
