name: tff-sync
# Hourly: channels ensure → bootstrap drain (oldest-first, batched) →
# RSS diff sync (new episodes) → AI-subtitle subsync finishing queue.
on:
  schedule:
    - cron: "27 * * * *"
    - cron: "57 * * * *"   # second tick: GitHub drops scheduled runs under load — two chances per hour, concurrency dedupes
  workflow_dispatch:
    inputs:
      force:
        description: "Only process episodes whose title contains this. Bypasses done/match guards — supervised tests only."
        required: false
        default: ""
      batch:
        description: "bootstrap batch size this run (0 = env default 15)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: tff-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: enable BBR (counters lossy-path throughput collapse; measured 24x)
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: restore state (done/ledger/rotate_cache/…)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: tff-state-${{ github.run_id }}
          restore-keys: tff-state-
      - name: ensure channels exist
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
          TFS_MEDIA_TIMEOUT: "2700"
          TFS_AUDIO_BITRATE: "16k"
          TFS_PARALLEL: "2"
          TFS_GOV_MAX: "3"
          TFS_BASE: ${{ github.workspace }}/state
        run: python3 tfs_engine.py channels --ensure
      - name: bootstrap drain (oldest-first batch)
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
          TFS_MEDIA_TIMEOUT: "2700"
          TFS_AUDIO_BITRATE: "16k"
          TFS_PARALLEL: "2"
          TFS_GOV_MAX: "3"
          TFS_BASE: ${{ github.workspace }}/state
          TFS_BOOTSTRAP_BATCH: ${{ inputs.batch || '15' }}
        run: python3 tfs_engine.py bootstrap --limit "${TFS_BOOTSTRAP_BATCH:-15}"
      - name: import smoke test (fail fast on name/syntax breaks)
        env:                      # dummy: import-time presence check only — no secrets, no network
          EUDIC_COOKIE: "smoke=dummy"
          EUDIC_USER: smoke
          EUDIC_PASS: smoke
        run: |
          python3 -m pip install pyflakes -q
          if python3 -m pyflakes tfs_engine.py | grep -q "undefined name"; then
            python3 -m pyflakes tfs_engine.py | grep "undefined name"
            echo "undefined name(s) found — NameError-class mine defused pre-run"
            exit 1
          fi
          echo "pyflakes OK: no undefined names"
          python3 -c "
          import tfs_engine
          print('smoke OK: module imports clean')"
          python3 -c "
          import tfs_engine as T
          assert callable(T.ff_bootstrap) and callable(T.post_article)
          print('smoke OK: entrypoints present')"
      - name: run sync (new episodes)
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
          TFS_MEDIA_TIMEOUT: "2700"
          TFS_AUDIO_BITRATE: "16k"
          TFS_PARALLEL: "2"
          TFS_GOV_MAX: "3"
          TFS_BASE: ${{ github.workspace }}/state
          TFS_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$TFS_FORCE" ]; then
            echo "force mode: $TFS_FORCE"
            python3 tfs_engine.py sync --force "$TFS_FORCE" --newest
          else
            python3 tfs_engine.py sync --newest
          fi
      - name: display order fix (post-sync, all populated channels)
        if: always()
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
        run: |
          python3 - <<'PY'
          import tfs_engine as t
          t.enforce_channel_order([c for _a, _b, c in t.tfs_channels()])
          t.fix_hidden([c for _a, _b, c in t.tfs_channels()])
          t.enforce_group_order()
          PY
      - name: finish AI subtitles (subsync finishing queue)
        if: always()
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          EUDIC_USER: ${{ secrets.EUDIC_USER }}
          EUDIC_PASS: ${{ secrets.EUDIC_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
          TFS_MEDIA_TIMEOUT: "2700"
          TFS_AUDIO_BITRATE: "16k"
          TFS_PARALLEL: "2"
          TFS_GOV_MAX: "3"
          TFS_BASE: ${{ github.workspace }}/state
        run: python3 tfs_engine.py subsync
      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: tff-state-${{ github.run_id }}
      - name: emit pit-status (protocol pit-status/1)
        if: always()
        run: python3 pit_report.py
      - name: commit audit ledger (public trail)
        if: always()
        run: |
          git config user.name "tff-bot"
          git config user.email "b921603@users.noreply.github.com"
          mkdir -p trail && cp -f state/sync_ledger.jsonl trail/ 2>/dev/null || true
          cp -f state/done.json trail/ 2>/dev/null || true
          cp -f state/pit-status.json trail/ 2>/dev/null || true
          cp -f state/sandbox_claims.jsonl trail/ 2>/dev/null || true
          git add trail/sync_ledger.jsonl trail/done.json trail/sandbox_claims.jsonl trail/pit-status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ledger: run ${{ github.run_id }}"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) \
              || echo "trail push deferred (race) — state cache carries it to next run"
          fi
      - name: notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PROGRESS_TOPIC: ${{ secrets.NTFY_PROGRESS_TOPIC }}
          TFS_MEDIA_TIMEOUT: "2700"
          TFS_AUDIO_BITRATE: "16k"
          TFS_PARALLEL: "2"
          TFS_GOV_MAX: "3"
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, requests, os
          rid = os.environ.get("RUN_ID", "unknown")
          msg = {"topic": os.environ["NTFY_TOPIC"], "title": "TFF GA: sync failed",
                 "priority": 4, "tags": ["rotating_light"],
                 "message": ("GitHub Actions sync 失敗（run " + rid + "）。\n" +
                             "查日誌：https://github.com/b921603/tf-engine/actions/run/" + rid +
                             "\n常見原因：cookie 過期（同時會發 TFF GA: cookie expired）或上傳鏈路異常。")}
          requests.post("https://ntfy.sh/", data=json.dumps(msg), timeout=20)
          PY
